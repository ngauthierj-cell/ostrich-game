<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Écurie — Bolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F6EEDF;
    --card-bg:#FFFBF3;
    --ink:#221F2C;
    --ink-soft:#4A4658;
    --text-secondary:#8A8172;
    --text-muted:#B7AC98;
    --border:rgba(34,31,44,0.10);
    --pink:#E68C82;
    --pink-dark:#B85A50;
    --pink-tint:#FBE2DC;
    --cream-ruff:#F1E6D4;
    --gold:#F0A93A;
    --gold-dark:#B9701C;
    --gold-tint:#FCE9C9;
    --sage:#8FB48E;
    --sage-dark:#3E6B44;
    --sage-tint:#E4EFDF;
    --sky:#7FB6D9;
    --sky-dark:#3E6E82;
    --sky-tint:#DCEAF3;
    --track:#F1E9DA;
    --radius-card:22px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-page);
    font-family:'Nunito',sans-serif;
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  .app{width:100%;max-width:380px;}
  .screen.hidden{display:none;}

  /* ---------- Écran écurie (liste) ---------- */
  .ecurie-header{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 14px;}
  .ecurie-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;color:var(--ink);margin:0;}
  .ecurie-count{font-size:12px;font-weight:700;color:var(--text-secondary);}
  .ecurie-list{display:flex;flex-direction:column;gap:10px;}
  .ecurie-card{
    display:flex;align-items:center;gap:12px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:18px;
    padding:11px 13px;cursor:pointer;
    box-shadow:0 8px 20px -16px rgba(34,31,44,0.35);
    transition:transform .12s ease, filter .12s ease;
  }
  .ecurie-card:active{transform:scale(.98);}
  .ecurie-avatar{
    width:50px;height:50px;flex-shrink:0;border-radius:14px;
    border:2px solid #fff;box-shadow:0 0 0 1px var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .ecurie-avatar svg{width:44px;height:44px;}
  .ecurie-info{flex:1;min-width:0;}
  .ecurie-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--ink);margin:0 0 5px;}
  .ecurie-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;}
  .chip{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);
    background:var(--track);color:var(--text-secondary);white-space:nowrap;
  }
  .chip.trait{background:var(--pink-tint);color:var(--pink-dark);}
  .chip.stage-poussin{background:var(--sage-tint);color:var(--sage-dark);}
  .chip.stage-jeune{background:var(--sky-tint);color:var(--sky-dark);}
  .chip.stage-adulte{background:var(--track);color:var(--ink-soft);}
  .chip.stage-veterane{background:var(--gold-tint);color:var(--gold-dark);}
  .ecurie-capital{display:flex;align-items:center;gap:7px;}
  .ecurie-capital-track{flex:1;height:6px;background:var(--track);border-radius:var(--radius-pill);overflow:hidden;}
  .ecurie-capital-fill{height:100%;border-radius:var(--radius-pill);background:var(--gold);}
  .ecurie-capital-value{font-size:10px;font-weight:800;color:var(--text-secondary);flex-shrink:0;}
  .ecurie-chevron{color:var(--text-muted);flex-shrink:0;}
  .ecurie-chevron svg{width:18px;height:18px;}

  /* ---------- Écran fiche détail ---------- */
  .fiche-topbar{margin:0 2px 10px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;padding:6px 2px;cursor:pointer;
    font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--ink-soft);
  }
  .back-btn svg{width:16px;height:16px;}

  .card{
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:20px;
    box-shadow:0 10px 30px -18px rgba(34,31,44,0.35);
    position:relative;
  }

  /* header */
  .head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;}
  .avatar{
    width:76px;height:76px;flex-shrink:0;border-radius:20px;
    background:var(--pink-tint);
    border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 0 0 1px var(--border);
  }
  .head-info{flex:1;min-width:0;}
  .name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;color:var(--ink);margin:0 0 5px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}

  /* section shell */
  .section{border-top:1px dashed var(--border);padding-top:14px;margin-bottom:14px;}
  .section-label{
    font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--text-muted);margin:0 0 10px;
  }

  /* stats */
  .stat-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .stat-row:last-child{margin-bottom:0;}
  .stat-icon{width:20px;height:20px;flex-shrink:0;color:var(--pink-dark);}
  .stat-row.locked .stat-icon{color:var(--text-muted);}
  .stat-label{font-size:12px;font-weight:700;color:var(--ink-soft);width:62px;flex-shrink:0;}
  .stat-row.locked .stat-label{color:var(--text-muted);}
  .stat-track{flex:1;height:9px;background:var(--track);border-radius:var(--radius-pill);overflow:hidden;}
  .stat-fill{height:100%;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--gold),var(--pink));}
  .stat-fill.locked{
    width:100% !important;
    background:repeating-linear-gradient(45deg,var(--track),var(--track) 5px,#fff 5px,#fff 10px);
  }
  .lock-wrap{width:16px;flex-shrink:0;display:flex;justify-content:center;color:var(--text-muted);visibility:hidden;}
  .stat-row.locked .lock-wrap{visibility:visible;}
  .locked-note{font-size:10px;color:var(--text-muted);margin:2px 0 0 91px;}
  .locked-note.hidden{display:none;}

  /* capital */
  .capital-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .capital-title{font-size:12px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .capital-title svg{width:15px;height:15px;color:var(--gold-dark);}
  .capital-value{font-size:12px;font-weight:800;color:var(--ink);}
  .capital-track{height:9px;background:var(--track);border-radius:var(--radius-pill);overflow:hidden;}
  .capital-fill{height:100%;background:var(--gold);border-radius:var(--radius-pill);}

  /* pedigree accordion */
  .pedigree-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--pink-tint);border:none;border-radius:14px;
    padding:11px 14px;margin-bottom:0;cursor:pointer;
    font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--pink-dark);
  }
  .pedigree-btn .left{display:flex;align-items:center;gap:8px;}
  .pedigree-btn svg{width:16px;height:16px;}
  .pedigree-btn .chevron{transition:transform .25s ease;}
  .pedigree-btn[aria-expanded="true"] .chevron{transform:rotate(90deg);}

  .pedigree-panel{
    overflow:hidden;
    max-height:0;
    transition:max-height .3s ease, margin-top .3s ease;
    margin-top:0;
  }
  .pedigree-panel.open{max-height:220px;margin-top:10px;}
  .pedigree-tree{
    background:var(--track);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .pedigree-gen-label{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);}
  .pedigree-row{display:flex;gap:10px;}
  .pedigree-parent{
    flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;
    border:1px solid var(--border);
  }
  .pedigree-avatar{
    width:32px;height:32px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .pedigree-name{font-size:12px;font-weight:800;color:var(--ink);margin:0 0 2px;}
  .pedigree-info{min-width:0;}
  .pedigree-unknown{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;
    border:1px dashed var(--border);color:var(--text-muted);font-size:12px;font-weight:700;
  }
  .pedigree-unknown svg{width:20px;height:20px;flex-shrink:0;}

  .actions-section{border-top:1px dashed var(--border);padding-top:14px;margin-bottom:0;}

  /* actions */
  .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn{
    font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
    border-radius:14px;padding:11px 10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .12s ease, filter .12s ease;
    border:none;
  }
  .btn:active{transform:translateY(2px);}
  .btn svg{width:16px;height:16px;flex-shrink:0;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--ink-soft);}
  .btn-outline:hover{filter:brightness(.98);}
  .btn-outline.disabled{color:var(--text-muted);}
  .btn-primary{
    grid-column:span 2;background:var(--gold);color:#5A3607;
  }
  .btn-primary:hover{filter:brightness(1.03);}

  /* toast */
  .toast{
    position:absolute;left:50%;bottom:14px;transform:translate(-50%,12px);
    background:var(--ink);color:#fff;font-size:12px;font-weight:700;
    padding:9px 16px;border-radius:var(--radius-pill);white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.4);
    max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<h2 class="sr-only">Écurie du joueur : liste des autruches possédées, avec accès à la fiche détail de chacune.</h2>

<div class="app">

  <!-- ---------- Écran 1 : vue d'ensemble écurie ---------- -->
  <div class="screen" id="screenEcurie">
    <div class="ecurie-header">
      <p class="ecurie-title">Mon écurie</p>
      <span class="ecurie-count" id="ecurieCount"></span>
    </div>
    <div class="ecurie-list" id="ecurieList"></div>
  </div>

  <!-- ---------- Écran 2 : fiche détail (pivot, cf. rapport §11) ---------- -->
  <div class="screen hidden" id="screenFiche">
    <div class="fiche-topbar">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Écurie
      </button>
    </div>

    <div class="card">

      <div class="head">
        <div class="avatar" id="ficheAvatar">
          <svg viewBox="0 0 120 100" width="76" height="76" fill="none" id="ficheAvatarSvg">
            <g>
              <ellipse cx="14" cy="66" rx="13" ry="9" fill="#F1E6D4" transform="rotate(-25 14 66)"/>
              <ellipse cx="10" cy="54" rx="11" ry="8" fill="#F1E6D4" transform="rotate(-45 10 54)"/>
              <ellipse cx="12" cy="42" rx="10" ry="7" fill="#F1E6D4" transform="rotate(-65 12 42)"/>
            </g>
            <path d="M15 100C10 78 18 55 34 44c6-4 10-10 20-11 12-1 22 6 25 18 4 15-2 32-14 44 -5 5-14 6-24 6z" fill="#221F2C"/>
            <path d="M30 46c4-2 7-5 9-9M42 40c3-3 5-7 6-11M54 39c2-4 3-8 3-12" stroke="#F1E6D4" stroke-width="4" stroke-linecap="round" fill="none" opacity=".55"/>
            <path d="M42 100c-3-16 2-30 14-36 8 6 12 20 9 36z" fill="#F1E6D4"/>
            <path d="M56 90C52 74 55 55 66 42S89 18 88 8" stroke="#E68C82" stroke-width="17" stroke-linecap="round" fill="none" class="fiche-neck"/>
            <path d="M74 6c0 5-1 9-3 12M83 3c1 5 0 9-2 12M91 5c2 4 2 8 1 12" stroke="#E68C82" stroke-width="6" stroke-linecap="round" fill="none" class="fiche-neck"/>
            <circle cx="88" cy="21" r="17" fill="#E68C82" class="fiche-head"/>
            <path d="M100 17c6 1 12 4 16 8-6 2-12 2-18 0z" fill="#F0A93A"/>
            <path d="M99 25c5 2 10 4 15 3-4 3-10 3-15 1z" fill="#C97F1E"/>
            <path d="M78 10c-3 1-5 3-6 6" stroke="#221F2C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <ellipse cx="82" cy="19" rx="7" ry="6.5" fill="#fff"/>
            <circle cx="84" cy="19" r="3.4" fill="#221F2C"/>
            <circle cx="85.5" cy="17.5" r="1.1" fill="#fff"/>
          </svg>
        </div>
        <div class="head-info">
          <p class="name" id="ficheName"></p>
          <div class="chips">
            <span class="chip" id="ficheStageChip"></span>
            <span class="chip" id="ficheCoatChip"></span>
            <span class="chip trait" id="ficheTraitChip"></span>
          </div>
        </div>
      </div>

      <div class="section">
        <p class="section-label">Statistiques</p>

        <div class="stat-row" id="statSpeed">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>
          <span class="stat-label">Vitesse</span>
          <div class="stat-track"><div class="stat-fill"></div></div>
          <div class="lock-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
          </div>
        </div>

        <div class="stat-row" id="statEndurance">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.4-9.5-8.8C1 8.6 2.8 5 6.3 5c1.9 0 3.2 1 3.7 2.3C10.5 6 11.8 5 13.7 5c3.5 0 5.3 3.6 3.8 7.2C15 16.6 12 21 12 21z" fill="currentColor"/></svg>
          <span class="stat-label">Endurance</span>
          <div class="stat-track"><div class="stat-fill"></div></div>
          <div class="lock-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
          </div>
        </div>

        <div class="stat-row" id="statAgility">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="none"><path d="M20 12l-6-6v4H4v4h10v4z" fill="currentColor"/></svg>
          <span class="stat-label">Agilité</span>
          <div class="stat-track"><div class="stat-fill"></div></div>
          <div class="lock-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
          </div>
        </div>
        <p class="locked-note hidden" id="lockedNote">Stat non révélée — se débloque en course, ou instantanément avec un Scanner génétique.</p>
      </div>

      <div class="section">
        <div class="capital-top">
          <span class="capital-title">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 20c4-8 7-8 9-8s3 3 7 3M4 20c2-3 3-6 3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            Capital course restant
          </span>
          <span class="capital-value" id="capitalValue"></span>
        </div>
        <div class="capital-track"><div class="capital-fill" id="capitalFill"></div></div>
      </div>

      <button class="pedigree-btn" id="pedigreeBtn" aria-expanded="false" aria-controls="pedigreePanel">
        <span class="left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v6a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V3M12 13v8M6 3a2 2 0 1 0 0 .01M18 3a2 2 0 1 0 0 .01"/></svg>
          Voir le pedigree
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="pedigree-panel" id="pedigreePanel">
        <div class="pedigree-tree" id="pedigreeTree"></div>
      </div>

      <div class="section actions-section">
        <p class="section-label">Actions</p>
        <div class="actions-grid">
          <button class="btn btn-outline" id="btnEntretien">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-4.4-9.5-8.8C1 8.6 2.8 5 6.3 5c1.9 0 3.2 1 3.7 2.3C10.5 6 11.8 5 13.7 5c3.5 0 5.3 3.6 3.8 7.2C15 16.6 12 21 12 21z"/></svg>
            Entretien
          </button>
          <button class="btn btn-outline" id="btnReproduire">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="13" rx="6" ry="8"/></svg>
            Reproduire
          </button>
          <button class="btn btn-primary" id="btnVendre">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.3 12.3 20.6a2 2 0 0 1-2.8 0l-7-7a2 2 0 0 1 0-2.8L11 2.6A2 2 0 0 1 12.4 2H19a2 2 0 0 1 2 2v6.6a2 2 0 0 1-.6 1.4z"/><circle cx="16.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg>
            Mettre en vente
          </button>
        </div>
      </div>

      <div class="toast" id="toast"></div>

    </div>
  </div>

</div>

<script>
(() => {
  "use strict";

  // Style par trait (Autruchomètre, cf. index.html) — réutilisé pour teinter l'avatar
  // (grand comme en liste) et les vignettes de pedigree, afin qu'un trait garde la
  // même couleur partout dans l'app.
  const TRAIT_STYLE = {
    "Têtue":      { tint:"var(--gold-tint)", solid:"#B9701C", filter:"none" },
    "Ambitieuse": { tint:"var(--pink-tint)", solid:"#B85A50", filter:"none" },
    "Parano":     { tint:"var(--sky-tint)",  solid:"#3E6E82", filter:"hue-rotate(150deg) saturate(1.3)" },
    "Froussarde": { tint:"var(--sage-tint)", solid:"#3E6B44", filter:"hue-rotate(70deg) saturate(1.2)" }
  };
  const STAGE_CAPITAL = 120; // capital course total sur la carrière (rapport §8.2)
  const STAGE_CLASS = { "Poussin":"stage-poussin", "Jeune":"stage-jeune", "Adulte":"stage-adulte", "Vétérane":"stage-veterane" };

  // Roster mock — un représentant par stade de vie (rapport §8.4), pour couvrir les cas
  // d'affichage : stats verrouillées, pedigree inconnu, action Reproduire indisponible...
  const OSTRICHES = [
    {
      id:"bolt", name:"Bolt", stage:"Adulte", coat:"Pic", trait:"Ambitieuse", capital:62,
      stats:{ speed:78, endurance:55, agility:null },
      pedigree:[ {name:"Comète", trait:"Têtue"}, {name:"Silex", trait:"Parano"} ]
    },
    {
      id:"comete", name:"Comète", stage:"Vétérane", coat:"Doré", trait:"Têtue", capital:112,
      stats:{ speed:70, endurance:38, agility:61 },
      pedigree:null
    },
    {
      id:"griotte", name:"Griotte", stage:"Jeune", coat:"Roux", trait:"Parano", capital:9,
      stats:{ speed:64, endurance:null, agility:null },
      pedigree:[ {name:"Bolt", trait:"Ambitieuse"}, {name:"Comète", trait:"Têtue"} ]
    },
    {
      id:"nougat", name:"Nougat", stage:"Poussin", coat:"Sable", trait:"Froussarde", capital:0,
      stats:{ speed:null, endurance:null, agility:null },
      pedigree:[ {name:"Griotte", trait:"Parano"}, {name:"Sable", trait:"Ambitieuse"} ]
    },
    {
      id:"silex", name:"Silex", stage:"Adulte", coat:"Gris", trait:"Parano", capital:45,
      stats:{ speed:59, endurance:66, agility:52 },
      pedigree:null
    }
  ];

  const screenEcurie = document.getElementById("screenEcurie");
  const screenFiche = document.getElementById("screenFiche");
  const ostrichAvatarSvg = document.getElementById("ficheAvatarSvg").outerHTML;

  function ecurieCardHTML(o){
    const style = TRAIT_STYLE[o.trait];
    return `
      <div class="ecurie-avatar" style="background:${style.tint};">
        <div style="filter:${style.filter};display:flex;">${ostrichAvatarSvg}</div>
      </div>
      <div class="ecurie-info">
        <p class="ecurie-name">${o.name}</p>
        <div class="ecurie-chips">
          <span class="chip ${STAGE_CLASS[o.stage]}">${o.stage}</span>
          <span class="chip trait">${o.trait}</span>
        </div>
        <div class="ecurie-capital">
          <div class="ecurie-capital-track"><div class="ecurie-capital-fill" style="width:${o.capital/STAGE_CAPITAL*100}%;"></div></div>
          <span class="ecurie-capital-value">${o.capital}/${STAGE_CAPITAL}</span>
        </div>
      </div>
      <div class="ecurie-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>`;
  }

  function renderEcurieList(){
    document.getElementById("ecurieCount").textContent = `${OSTRICHES.length} autruche${OSTRICHES.length > 1 ? "s" : ""}`;
    const list = document.getElementById("ecurieList");
    list.innerHTML = "";
    OSTRICHES.forEach(o => {
      const card = document.createElement("div");
      card.className = "ecurie-card";
      card.innerHTML = ecurieCardHTML(o);
      card.addEventListener("click", () => openFiche(o.id));
      list.appendChild(card);
    });
  }

  function pedigreeParentHTML(p){
    const style = TRAIT_STYLE[p.trait];
    return `
      <div class="pedigree-parent">
        <div class="pedigree-avatar" style="background:${style.tint};">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><ellipse cx="10" cy="14" rx="7" ry="5.5" fill="${style.solid}"/><circle cx="17" cy="7" r="4.5" fill="${style.solid}"/><circle cx="18.5" cy="6" r="1" fill="#221F2C"/></svg>
        </div>
        <div class="pedigree-info">
          <p class="pedigree-name">${p.name}</p>
          <span class="chip trait">${p.trait}</span>
        </div>
      </div>`;
  }

  function fillStatRow(rowId, value){
    const row = document.getElementById(rowId);
    const fill = row.querySelector(".stat-fill");
    if(value === null){
      row.classList.add("locked");
      fill.classList.add("locked");
      fill.style.width = "";
    } else {
      row.classList.remove("locked");
      fill.classList.remove("locked");
      fill.style.width = value + "%";
    }
  }

  function openFiche(id){
    const o = OSTRICHES.find(x => x.id === id);
    if(!o) return;
    const style = TRAIT_STYLE[o.trait];

    document.getElementById("ficheAvatar").style.background = style.tint;
    document.getElementById("ficheAvatarSvg").style.filter = style.filter;
    document.getElementById("ficheName").textContent = o.name;
    const stageChip = document.getElementById("ficheStageChip");
    stageChip.textContent = o.stage;
    stageChip.className = "chip " + STAGE_CLASS[o.stage];
    document.getElementById("ficheCoatChip").textContent = o.coat;
    document.getElementById("ficheTraitChip").textContent = o.trait;

    fillStatRow("statSpeed", o.stats.speed);
    fillStatRow("statEndurance", o.stats.endurance);
    fillStatRow("statAgility", o.stats.agility);
    const anyLocked = o.stats.speed === null || o.stats.endurance === null || o.stats.agility === null;
    document.getElementById("lockedNote").classList.toggle("hidden", !anyLocked);

    document.getElementById("capitalValue").textContent = `${o.capital} / ${STAGE_CAPITAL}`;
    document.getElementById("capitalFill").style.width = (o.capital/STAGE_CAPITAL*100) + "%";

    const tree = document.getElementById("pedigreeTree");
    if(o.pedigree){
      tree.innerHTML = `<p class="pedigree-gen-label">Parents</p><div class="pedigree-row">${o.pedigree.map(pedigreeParentHTML).join("")}</div>`;
    } else {
      tree.innerHTML = `<div class="pedigree-unknown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.8.9c0 1.6-2.3 1.7-2.3 3.4M12 17.2v.1"/></svg>
        Pedigree inconnu — origine non renseignée
      </div>`;
    }
    document.getElementById("pedigreePanel").classList.remove("open");
    document.getElementById("pedigreeBtn").setAttribute("aria-expanded", "false");

    document.getElementById("btnEntretien").onclick = () => showToast(`Entretien effectué sur ${o.name} — endurance restaurée !`);
    document.getElementById("btnReproduire").onclick = () => {
      if(o.stage === "Poussin"){
        showToast(`${o.name} est trop jeune pour se reproduire`);
      } else {
        showToast(`Choisis un second parent pour reproduire ${o.name}`);
      }
    };
    document.getElementById("btnVendre").onclick = () => showToast(`${o.name} est mise en vente sur le marché`);

    screenEcurie.classList.add("hidden");
    screenFiche.classList.remove("hidden");
  }

  function closeFiche(){
    screenFiche.classList.add("hidden");
    screenEcurie.classList.remove("hidden");
  }

  document.getElementById("backBtn").addEventListener("click", closeFiche);

  const pedigreeBtn = document.getElementById("pedigreeBtn");
  const pedigreePanel = document.getElementById("pedigreePanel");
  pedigreeBtn.addEventListener("click", () => {
    const open = pedigreePanel.classList.toggle("open");
    pedigreeBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });

  const toast = document.getElementById("toast");
  let toastTimeout = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  renderEcurieList();
})();
</script>

</body>
</html>
