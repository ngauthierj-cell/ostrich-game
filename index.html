<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ostrich — Sprint ligne droite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F6EEDF;
    --card-bg:#FFFBF3;
    --ink:#221F2C;
    --ink-soft:#4A4658;
    --text-secondary:#8A8172;
    --border:rgba(34,31,44,0.12);
    --pink:#E68C82;
    --pink-dark:#B85A50;
    --pink-tint:#FBE2DC;
    --gold:#F0A93A;
    --gold-dark:#B9701C;
    --sage:#8FB48E;
    --sage-tint:#E4EFDF;
    --track:#F1E9DA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:var(--bg-page);
    font-family:'Nunito',sans-serif;
    display:flex;justify-content:center;align-items:center;
    min-height:100%;
    touch-action:none;
    padding:16px;
  }
  #app{
    position:relative;
    width:100%;max-width:400px;
    aspect-ratio:9/16;
    background:var(--card-bg);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 16px 40px -20px rgba(34,31,44,.4);
    border:1px solid var(--border);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px;text-align:center;
    background:linear-gradient(180deg,#FBF3E4,#F3E4CE);
  }
  .hidden{display:none !important;}
  h1{font-family:'Fredoka',sans-serif;font-size:26px;color:var(--ink);margin:0 0 4px;}
  .subtitle{font-size:13px;color:var(--text-secondary);margin:0 0 22px;font-weight:700;}
  .trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:16px;}
  .trait-btn{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;
    padding:14px 8px;border-radius:16px;border:2px solid var(--border);
    background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .trait-btn.selected{border-color:var(--pink-dark);background:var(--pink-tint);color:var(--pink-dark);}
  .match-badge{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;
    padding:6px 14px;border-radius:999px;margin-bottom:20px;
  }
  .match-bon{background:var(--sage-tint);color:#3E6B44;}
  .match-neutre{background:var(--track);color:var(--text-secondary);}
  .match-mauvais{background:#F7DCD6;color:var(--pink-dark);}
  .big-btn{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;
    background:var(--gold);color:#5A3607;border:none;border-radius:16px;
    padding:14px 40px;cursor:pointer;box-shadow:0 6px 0 var(--gold-dark);
  }
  .big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold-dark);}
  .hint{font-size:11px;color:var(--text-secondary);margin-top:16px;font-weight:700;line-height:1.6;}

  .hud{
    position:absolute;top:0;left:0;right:0;padding:12px 14px;
    display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none;
  }
  .hud-row{display:flex;align-items:center;gap:8px;}
  .hud-track{flex:1;height:8px;background:rgba(34,31,44,.18);border-radius:999px;overflow:hidden;}
  .hud-fill{height:100%;border-radius:999px;background:var(--gold);}
  .stamina-fill{height:100%;border-radius:999px;background:var(--pink);}
  .hud-label{font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);width:62px;flex-shrink:0;}

  .event-banner{
    position:absolute;top:13%;left:50%;transform:translateX(-50%);
    background:rgba(34,31,44,.8);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;
    padding:7px 16px;border-radius:999px;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;
    white-space:nowrap;
  }
  .event-banner.show{opacity:1;}

  .sprint-btn{
    position:absolute;right:16px;bottom:16px;z-index:6;
    width:76px;height:76px;border-radius:50%;border:3px solid var(--pink-dark);
    background:radial-gradient(circle at 35% 30%,#F6A79C,#E68C82 60%,#C96D62);
    color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;font-size:11px;line-height:1.3;
    box-shadow:0 6px 0 #8E3F37;cursor:pointer;touch-action:none;user-select:none;
  }
  .sprint-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #8E3F37;}
  .sprint-btn.cooling{opacity:.4;filter:grayscale(.6);box-shadow:0 6px 0 rgba(0,0,0,.15);}

  #result{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(246,238,223,.97);padding:28px;text-align:center;
  }
  .rank-list{width:100%;margin:16px 0 22px;display:flex;flex-direction:column;gap:8px;}
  .rank-row{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);
    border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;color:var(--ink-soft);
  }
  .rank-row.me{border-color:var(--pink-dark);background:var(--pink-tint);color:var(--pink-dark);}
  .rank-pos{width:22px;font-family:'Fredoka',sans-serif;color:var(--gold-dark);}
  .rank-gain{margin-left:auto;font-size:12px;color:var(--sage);}
</style>
</head>
<body>

<div id="app">
  <canvas id="race"></canvas>

  <!-- Écran de sélection -->
  <div id="start" class="overlay">
    <h1>Sprint ligne droite</h1>
    <p class="subtitle">Savane · Type 1 · Choisis ton autruche</p>
    <div class="trait-grid" id="traitGrid"></div>
    <div class="match-badge" id="matchBadge"></div>
    <button class="big-btn" id="startBtn">C'est parti !</button>
    <p class="hint">Tape à un rythme régulier pour accélérer · Glisse le doigt pour te déplacer et éviter trous, cailloux et broussailles · Bouton ⚡ pour sprinter</p>
  </div>

  <!-- Bannière événement dynamique -->
  <div class="event-banner" id="eventBanner"></div>

  <!-- HUD course -->
  <div class="hud hidden" id="hud">
    <div class="hud-row">
      <span class="hud-label">Course</span>
      <div class="hud-track"><div class="hud-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="hud-row">
      <span class="hud-label">Endurance</span>
      <div class="hud-track"><div class="stamina-fill" id="staminaFill" style="width:100%"></div></div>
    </div>
  </div>

  <!-- Bouton sprint dédié (en plus du swipe vers le bas) -->
  <button class="sprint-btn hidden" id="sprintBtn">⚡<br>SPRINT</button>

  <!-- Résultats -->
  <div id="result" class="overlay hidden">
    <h1>Arrivée !</h1>
    <p class="subtitle" id="resultSubtitle"></p>
    <div class="rank-list" id="rankList"></div>
    <button class="big-btn" id="replayBtn">Retenter la course</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Constantes de jeu ---------- */
  const TRACK_LENGTH   = 6000;
  const BASE_SPEED     = 175;
  const MAX_SPEED      = 270;
  const REST_SPEED     = 95;
  const SCALE           = 1.3; // px écran par unité d'écart de progression (autruches, obstacles, ligne d'arrivée)
  const RACER_COUNT     = 5;   // nombre total de coureurs (joueur + IA) -> nombre de couloirs affichés

  const TRAITS = ["Têtue","Ambitieuse","Parano","Froussarde"];
  // Matching trait <-> format de piste (rapport de concept §7.1) : fixe, pas aléatoire.
  // Sur Sprint ligne droite : Têtue est forte (pas de distraction), Ambitieuse et Parano
  // sont faibles (démarrage lent / zigzague pour rien), Froussarde est neutre sur ce format.
  const SPRINT_MATCH = { "Têtue":"bon", "Ambitieuse":"mauvais", "Parano":"mauvais", "Froussarde":"neutre" };
  const PAYOUTS = [50,35,20,10,10]; // en Picaillons, selon classement (rapport §9.1, §7.2 pour le bonus/malus de matching)

  // Obstacles fixes (rapport §5.2) : trou (le plus punitif), caillou (moyen), broussaille (léger, plus large).
  // Rayons de collision volontairement larges : il faut réagir et changer de couloir,
  // pas juste passer à proximité pour les éviter.
  const OBSTACLE_TYPES = {
    trou:        { hitRadius:0.16, stumbleDur:0.55, speedMult:0.35 },
    caillou:     { hitRadius:0.14, stumbleDur:0.32, speedMult:0.55 },
    broussaille: { hitRadius:0.20, stumbleDur:0.22, speedMult:0.75 }
  };
  const OBSTACLE_KEYS = Object.keys(OBSTACLE_TYPES);

  // Bousculade Ambitieuse : gabarit propre, plus marqué qu'une broussaille pour rester perceptible.
  const AMBITIEUSE_BUMP = { hitRadius:0.20, stumbleDur:0.45, speedMult:0.55 };

  const COLORS = {
    player:  {body:"#E68C82", ruff:"#F1E6D4", dark:"#221F2C"},
    ai:[
      {body:"#7FA8B8", ruff:"#EFE7DA", dark:"#2A3A40"},
      {body:"#C7A6E0", ruff:"#F1E6D4", dark:"#332B3B"},
      {body:"#E0B25A", ruff:"#F6EFD9", dark:"#3A2E15"},
      {body:"#8FB48E", ruff:"#EFE9D6", dark:"#243424"}
    ]
  };

  /* ---------- État ---------- */
  let chosenTrait = TRAITS[0];
  let chosenMatch = SPRINT_MATCH[chosenTrait];
  let racers = [];
  let obstacles = [];
  let events = [];       // événements dynamiques (rapport §5.2/§7) : surprise partagée par tous les coureurs
  let hawkT = 0;         // anim. en cours d'un rapace qui passe (0 = rien)
  let activeDangerLane = null; // couloir menacé par l'événement en cours (null = aucun)
  let dangerWarnT = 0;         // temps restant pour réagir avant résolution
  let bannerTimeout = null;
  let raceRunning = false;
  let raceFinished = false;
  let elapsedTime = 0;
  let lastTs = 0;
  let bgScroll = 0;
  let shake = 0;
  let sprintFlashT = 0; // retour visuel plein écran au déclenchement du sprint

  /* ---------- Canvas ---------- */
  const canvas = document.getElementById("race");
  const ctx = canvas.getContext("2d");
  const app = document.getElementById("app");
  let W = 0, H = 0;

  function resize(){
    const r = app.getBoundingClientRect();
    W = canvas.width = r.width;
    H = canvas.height = r.height;
  }
  window.addEventListener("resize", resize);

  /* ---------- UI: sélection du trait ---------- */
  const traitGrid = document.getElementById("traitGrid");
  const matchBadge = document.getElementById("matchBadge");

  function renderTraitGrid(){
    traitGrid.innerHTML = "";
    TRAITS.forEach(t => {
      const b = document.createElement("button");
      b.className = "trait-btn" + (t === chosenTrait ? " selected" : "");
      b.textContent = t;
      b.onclick = () => { chosenTrait = t; chosenMatch = SPRINT_MATCH[chosenTrait]; renderTraitGrid(); renderMatchBadge(); };
      traitGrid.appendChild(b);
    });
  }
  function renderMatchBadge(){
    matchBadge.className = "match-badge match-" + chosenMatch;
    const label = {bon:"✨ Bon matching", neutre:"Matching neutre", mauvais:"⚠ Mauvais matching"}[chosenMatch];
    matchBadge.textContent = label;
  }
  renderTraitGrid();
  renderMatchBadge();

  /* ---------- Modèle Ostrich ---------- */
  function makeRacer(isPlayer, trait, match, colorSet, skill){
    return {
      isPlayer, trait, match, colors: colorSet,
      progress: 0,           // distance parcourue (unités piste)
      lane: 0.5,             // position verticale 0..1 dans la bande
      targetLane: 0.5,
      speed: REST_SPEED,
      stamina: 1,            // 0..1
      sprintT: 0,            // temps restant de sprint
      sprintCooldown: 0,
      skill,                 // variance individuelle IA
      legPhase: Math.random()*10,
      finished:false,
      finishTime:0,
      stumbleT:0, stumbleMult:1,   // pénalité en cours suite à un obstacle heurté ou un événement
      hitFlashT:0,                 // retour visuel bref (pattes) au moment d'un obstacle heurté
      bumpFlashT:0,                // retour visuel bref (corps) au moment d'une bousculade avec une Ambitieuse
      bumpCooldown:0,              // anti-répétition pour la collision avec une Ambitieuse
      hitObstacles: new Set(),     // obstacles déjà traités (heurtés ou esquivés)
      dodgeDecisions: new Map()    // IA seulement : décision d'esquive par obstacle
    };
  }

  function generateEvents(){
    // Deux événements dynamiques par course (rapport §5.2), espacés dans le temps —
    // contrairement aux obstacles fixes, ils touchent tous les coureurs au même instant.
    const t1 = 6 + Math.random()*5;       // 6-11s
    const t2 = t1 + 9 + Math.random()*6;  // ~9-17s plus tard
    return [ { time:t1, triggered:false }, { time:t2, triggered:false } ];
  }

  function generateObstacles(){
    // Obstacles fixes rapprochés (rapport §5.2), répartis entre 12% et 90% de la piste.
    const count = 11;
    const start = TRACK_LENGTH*0.12, end = TRACK_LENGTH*0.90;
    const span = (end - start) / count;
    const list = [];
    for(let i=0;i<count;i++){
      const type = OBSTACLE_KEYS[Math.floor(Math.random()*OBSTACLE_KEYS.length)];
      const progress = start + i*span + Math.random()*span*0.6;
      const lane = 0.18 + Math.random()*0.64;
      list.push(Object.assign({ type, progress, lane }, OBSTACLE_TYPES[type]));
    }
    return list.sort((a,b)=>a.progress-b.progress);
  }

  function setupRace(){
    racers = [];
    racers.push(makeRacer(true, chosenTrait, chosenMatch, COLORS.player, 1));
    for(let i=0;i<RACER_COUNT-1;i++){
      const t = TRAITS[Math.floor(Math.random()*TRAITS.length)];
      const skill = 0.88 + Math.random()*0.34; // IA plus relevée : peut approcher/dépasser un joueur régulier
      racers.push(makeRacer(false, t, SPRINT_MATCH[t], COLORS.ai[i], skill));
    }
    obstacles = generateObstacles();
    events = generateEvents();
    hawkT = 0;
    activeDangerLane = null;
    dangerWarnT = 0;
    sprintFlashT = 0;
    elapsedTime = 0;
    raceFinished = false;
    bgScroll = 0;
  }

  /* ---------- Entrées ---------- */
  const input = {
    dragging:false, dragY:0,
    tapTimes:[], comboMult:1,
    lastPointerY:0, swipeStartY:0, swipeStartT:0
  };

  function pointerDown(y){
    input.dragging = true;
    input.dragY = y;
    input.swipeStartY = y;
    input.swipeStartT = performance.now();
    registerTap();
  }
  function pointerMove(y){
    if(!input.dragging) return;
    const player = racers[0];
    const rect = trackRectPx();
    const rel = (y - rect.top) / rect.height;
    player.targetLane = Math.min(1, Math.max(0, rel));
  }
  function pointerUp(y){
    if(input.dragging){
      const dt = performance.now() - input.swipeStartT;
      const dy = y - input.swipeStartY;
      if(dy > 40 && dt < 550){ trySprint(); } // swipe vers le bas : alternative au bouton ⚡
    }
    input.dragging = false;
  }
  function registerTap(){
    const player = racers[0];
    const now = performance.now();
    input.tapTimes.push(now);
    if(input.tapTimes.length > 6) input.tapTimes.shift();
    // évalue régularité des 3 derniers intervalles, fenêtre élargie/resserrée par le matching (rapport §7.2)
    if(input.tapTimes.length >= 3){
      const t = input.tapTimes;
      const i1 = t[t.length-1]-t[t.length-2];
      const i2 = t[t.length-2]-t[t.length-3];
      const variance = Math.abs(i1-i2);
      const { windowMult } = matchTiming(player.match);
      const loBound = 140 / windowMult, hiBound = 550 * windowMult, varBound = 130 * windowMult;
      if(i1 > loBound && i1 < hiBound && variance < varBound){
        input.comboMult = Math.min(1.55, input.comboMult + 0.07);
      } else {
        input.comboMult = Math.max(1, input.comboMult - 0.15);
      }
    }
    if(!raceFinished){
      const boost = 16 * input.comboMult;
      player.speed = Math.min(MAX_SPEED, player.speed + boost);
      player.stamina = Math.min(1, player.stamina + 0.004);
    }
  }
  function trySprint(){
    const player = racers[0];
    if(raceFinished) return;
    if(player.stamina > 0.12 && player.sprintCooldown <= 0){
      if(player.trait === "Têtue" && Math.random() < 0.3){
        // têtue : refuse parfois de sprinter, courte pause avant de pouvoir réessayer
        player.sprintCooldown = 0.3;
        showEventBanner("🦴 Elle refuse de sprinter !");
        return;
      }
      player.sprintT = 1.1;
      player.sprintCooldown = 0.9 * matchTiming(player.match).sprintCooldownMult;
      shake = 12;
      sprintFlashT = 0.3;
    }
  }

  canvas.addEventListener("pointerdown", e=>{ e.preventDefault(); pointerDown(e.clientY - app.getBoundingClientRect().top); });
  canvas.addEventListener("pointermove", e=>{ e.preventDefault(); pointerMove(e.clientY - app.getBoundingClientRect().top); });
  window.addEventListener("pointerup", e=>{ pointerUp(e.clientY - app.getBoundingClientRect().top); });

  const sprintBtn = document.getElementById("sprintBtn");
  sprintBtn.addEventListener("pointerdown", e=>{ e.preventDefault(); e.stopPropagation(); trySprint(); });

  function trackRectPx(){
    return { top: H*0.32, height: H*0.4 };
  }

  /* ---------- Matching trait <-> format (rapport §7.2) ---------- */
  // Traduit en gameplay concret plutôt qu'un multiplicateur de vitesse invisible :
  // bon matching = fenêtre de tap élargie + sprint qui recharge plus vite,
  // mauvais matching = fenêtre resserrée + recharge plus lente. L'IA n'a pas de
  // mécanique de tap : elle reçoit l'équivalent en vitesse de croisière (+12%/-10%).
  function matchTiming(match){
    if(match === "bon")     return { windowMult:1.15, staminaRegenMult:1.25, sprintCooldownMult:0.8, aiSpeedMult:1.12 };
    if(match === "mauvais") return { windowMult:0.85, staminaRegenMult:0.85, sprintCooldownMult:1.2, aiSpeedMult:0.90 };
    return                       { windowMult:1,    staminaRegenMult:1,    sprintCooldownMult:1,   aiSpeedMult:1 };
  }

  /* ---------- Comportements liés aux traits (Autruchomètre, rapport §7) ---------- */
  // Comportement inhérent au trait, toujours actif — indépendant du matching (qui,
  // lui, module la difficulté des contrôles via matchTiming ci-dessus).
  function applyTraitBehavior(r, dt){
    let mult = 1;
    if(r.trait === "Ambitieuse"){
      // démarrage lent, mais bonus de vitesse en fin de course (comeback mechanic)
      if(r.progress < TRACK_LENGTH*0.12) mult *= 0.55;
      if(r.progress > TRACK_LENGTH*0.80) mult *= 1.25;
    }
    if(r.trait === "Parano"){
      // zigzague seule (plus dur à contrôler) — oscillation de couloir, dont le centre
      // s'écarte de tout coureur qui s'approche trop, même sans danger réel (fausse alerte)
      let center = 0.5;
      const near = racers.find(o => o !== r && !o.finished && Math.abs(o.progress - r.progress) < 60 && Math.abs(o.lane - r.lane) < 0.25);
      if(near) center = near.lane < r.lane ? Math.min(0.85, r.lane + 0.25) : Math.max(0.15, r.lane - 0.25);
      r.targetLane = Math.max(0, Math.min(1, center + Math.sin(elapsedTime*3.2 + r.legPhase)*0.22));
    }
    if(r.trait === "Froussarde"){
      // ralentit près des obstacles (n'importe lequel, pas juste dans son couloir)
      const near = obstacles.find(o => !r.hitObstacles.has(o) && o.progress - r.progress > 0 && o.progress - r.progress < 380);
      if(near) mult *= 0.88;
    }
    // Têtue : réagit plus lentement aux directions — voir laneLerpRate dans updateRacer.
    // Réaction aux événements dynamiques (sprint imprévisible de Froussarde, etc.) : voir triggerSurpriseEvent.
    return mult;
  }

  /* ---------- Obstacles : collision et esquive ---------- */
  // Ajuste le rayon de collision et la pénalité selon le trait (rapport §7.1/§7 : Têtue
  // "ignore certains malus adverses", Parano "esquive mieux les obstacles aléatoires").
  function obstacleEffect(o, r){
    let hitRadius = o.hitRadius, stumbleDur = o.stumbleDur, speedMult = o.speedMult;
    if(r.trait === "Parano") hitRadius *= 0.4; // esquive renforcée : rayon de collision très réduit
    if(r.trait === "Têtue"){ stumbleDur *= 0.8; speedMult = 1 - (1-speedMult)*0.2; } // résistance allégée : les obstacles doivent encore la ralentir
    return { hitRadius, stumbleDur, speedMult };
  }
  function nextObstacleAhead(r, lookahead){
    return obstacles.find(o => !r.hitObstacles.has(o) && o.progress - r.progress > 0 && o.progress - r.progress < lookahead);
  }
  function checkObstacleCollision(r){
    for(const o of obstacles){
      if(r.hitObstacles.has(o) || r.progress < o.progress) continue;
      r.hitObstacles.add(o);
      const eff = obstacleEffect(o, r);
      if(Math.abs(r.lane - o.lane) < eff.hitRadius){
        r.stumbleT = Math.max(r.stumbleT, eff.stumbleDur);
        r.stumbleMult = eff.speedMult;
        r.hitFlashT = 0.35; // retour visuel de l'impact (voir drawOstrich)
        if(r.isPlayer) shake = Math.max(shake, 9);
      }
    }
  }
  function aiObstacleReaction(r){
    const upcoming = nextObstacleAhead(r, 650);
    if(!upcoming) return;
    if(!r.dodgeDecisions.has(upcoming)){
      const dodgeChance = 0.55 + r.skill*0.3 + (r.trait === "Parano" ? 0.35 : 0);
      r.dodgeDecisions.set(upcoming, Math.random() < dodgeChance);
    }
    if(!r.dodgeDecisions.get(upcoming)) return;
    const eff = obstacleEffect(upcoming, r);
    if(Math.abs(r.lane - upcoming.lane) < eff.hitRadius + 0.10){
      r.targetLane = upcoming.lane < 0.5 ? Math.min(1, upcoming.lane + 0.4) : Math.max(0, upcoming.lane - 0.4);
    }
  }

  /* ---------- Bousculade : Ambitieuse agit comme un obstacle faible pour les autres ---------- */
  // Contrairement aux obstacles fixes, elle se déplace : vérifiée chaque frame (proximité de
  // couloir + de progression). Le choc se voit sur le corps (voir bumpFlashT dans drawOstrich,
  // affiché pour tous les coureurs, pas seulement le joueur), jamais sur les pattes.
  function checkAmbitieuseBump(){
    const ambitieuses = racers.filter(r => r.trait === "Ambitieuse" && !r.finished);
    if(!ambitieuses.length) return;
    racers.forEach(r => {
      if(r.finished || r.bumpCooldown > 0 || r.trait === "Ambitieuse") return;
      for(const amb of ambitieuses){
        if(Math.abs(r.progress - amb.progress) > 50) continue;
        const eff = obstacleEffect(AMBITIEUSE_BUMP, r);
        if(Math.abs(r.lane - amb.lane) < eff.hitRadius){
          r.stumbleT = Math.max(r.stumbleT, eff.stumbleDur);
          r.stumbleMult = eff.speedMult;
          r.bumpFlashT = 0.6;
          r.bumpCooldown = 1.2;
          if(r.isPlayer) shake = Math.max(shake, 8);
          break;
        }
      }
    });
  }

  /* ---------- Événements dynamiques : "un rapace passe" (rapport §5.2/§7) ---------- */
  // Contrairement aux obstacles fixes, l'événement se déclenche pour tous au même instant
  // (elapsedTime), mais frappe un couloir précis, tiré au sort — comme un obstacle mobile,
  // il faut réellement en sortir pour l'éviter, sinon il active l'Autruchomètre.
  const HAWK_SWEEP_DUR = 1.8;                  // durée totale du survol en V (piqué puis remontée)
  const EVENT_REACT_DELAY = HAWK_SWEEP_DUR/2;  // résolution au point bas du piqué, milieu du survol
  function triggerSurpriseEvent(r, dangerLane){
    if(r.finished) return;
    const radius = r.trait === "Parano" ? 0.10 : 0.22; // Parano esquive encore mieux
    if(Math.abs(r.lane - dangerLane) >= radius) return; // hors de la zone : le rapace l'a ratée

    if(r.trait === "Têtue"){
      return; // ignore certains malus adverses : aucune réaction même touchée
    }
    if(r.trait === "Froussarde"){
      // sprint imprévisible : parfois un bond en avant, parfois la panique la ralentit —
      // dans les deux cas elle perd le contrôle de son couloir un instant
      r.targetLane = Math.random();
      if(Math.random() < 0.5){
        r.speed = Math.min(MAX_SPEED, r.speed * 1.5);
      } else {
        r.stumbleT = Math.max(r.stumbleT, 0.5);
        r.stumbleMult = 0.45;
      }
      return;
    }
    // réaction par défaut (Ambitieuse et les autres) : sursaut léger
    r.stumbleT = Math.max(r.stumbleT, 0.35);
    r.stumbleMult = 0.7;
  }

  function aiEventReaction(r, dangerLane){
    if(Math.abs(r.lane - dangerLane) > 0.35) return; // déjà hors de portée, inutile de réagir
    const dodgeChance = 0.5 + r.skill*0.3 + (r.trait === "Parano" ? 0.35 : 0);
    if(Math.random() < dodgeChance){
      r.targetLane = dangerLane < 0.5 ? Math.min(1, dangerLane + 0.4) : Math.max(0, dangerLane - 0.4);
    }
  }

  function showEventBanner(text){
    const el = document.getElementById("eventBanner");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(bannerTimeout);
    bannerTimeout = setTimeout(() => el.classList.remove("show"), 1400);
  }

  function checkEvents(){
    events.forEach(ev => {
      if(!ev.triggered && elapsedTime >= ev.time){
        ev.triggered = true;
        ev.dangerLane = Math.random();
        ev.resolveAt = ev.time + EVENT_REACT_DELAY;
        hawkT = HAWK_SWEEP_DUR;
        activeDangerLane = ev.dangerLane;
        dangerWarnT = EVENT_REACT_DELAY;
        showEventBanner("🦅 Un rapace fond sur la piste — change de couloir !");
        racers.forEach(r => { if(!r.isPlayer) aiEventReaction(r, ev.dangerLane); });
      }
      if(ev.triggered && !ev.resolved && elapsedTime >= ev.resolveAt){
        ev.resolved = true;
        racers.forEach(r => triggerSurpriseEvent(r, ev.dangerLane));
      }
    });
  }

  /* ---------- Boucle de mise à jour ---------- */
  function updateRacer(r, dt, isPlayer){
    if(r.finished) return;

    if(!isPlayer) aiObstacleReaction(r);

    // couloir : interpolation douce vers la cible (Têtue réagit beaucoup plus lentement aux directions)
    const laneLerpRate = r.trait === "Têtue" ? 2 : 6;
    r.lane += (r.targetLane - r.lane) * Math.min(1, dt*laneLerpRate);

    let behaviorMult = applyTraitBehavior(r, dt);
    checkObstacleCollision(r);
    if(r.stumbleT > 0){
      r.stumbleT -= dt;
      behaviorMult *= r.stumbleMult;
    }
    if(r.hitFlashT > 0) r.hitFlashT -= dt;
    if(r.bumpFlashT > 0) r.bumpFlashT -= dt;
    if(r.bumpCooldown > 0) r.bumpCooldown -= dt;
    const timing = matchTiming(r.match);

    if(isPlayer){
      // frein naturel vers vitesse de repos
      r.speed += (REST_SPEED - r.speed) * Math.min(1, dt*0.6);
      if(r.sprintT > 0){
        r.sprintT -= dt;
        r.speed += (MAX_SPEED - r.speed) * Math.min(1, dt*3.2);
        r.stamina = Math.max(0, r.stamina - dt*0.34);
      } else {
        r.stamina = Math.min(1, r.stamina + dt*0.05*timing.staminaRegenMult);
      }
      r.sprintCooldown = Math.max(0, r.sprintCooldown - dt);
      input.comboMult = Math.max(1, input.comboMult - dt*0.25);
    } else {
      // IA : vise une vitesse de croisière propre à son skill, modulée par le matching
      const cruise = BASE_SPEED * r.skill * timing.aiSpeedMult + Math.sin(elapsedTime*1.3 + r.legPhase)*8;
      r.speed += (cruise - r.speed) * Math.min(1, dt*0.9);
    }

    r.progress += r.speed * behaviorMult * dt;
    r.legPhase += dt * (4 + r.speed/60);

    if(r.progress >= TRACK_LENGTH && !r.finished){
      r.finished = true;
      r.finishTime = elapsedTime;
    }
  }

  function update(dt){
    elapsedTime += dt;
    bgScroll += racers[0].speed * dt;
    shake = Math.max(0, shake - dt*18);
    sprintFlashT = Math.max(0, sprintFlashT - dt);
    hawkT = Math.max(0, hawkT - dt);
    dangerWarnT = Math.max(0, dangerWarnT - dt);
    checkEvents();
    checkAmbitieuseBump();

    racers.forEach((r,i) => updateRacer(r, dt, i===0));

    const player = racers[0];
    document.getElementById("progressFill").style.width = Math.min(100, player.progress/TRACK_LENGTH*100) + "%";
    document.getElementById("staminaFill").style.width = Math.max(0, player.stamina*100) + "%";
    const sprintReady = player.stamina > 0.12 && player.sprintCooldown <= 0;
    sprintBtn.classList.toggle("cooling", !sprintReady);

    if(player.finished && !raceFinished){
      raceFinished = true;
      setTimeout(showResults, 650);
    }
  }

  /* ---------- Rendu ---------- */
  function drawBackground(){
    ctx.fillStyle = "#FBE9C6";
    ctx.fillRect(0,0,W,H*0.32);
    ctx.fillStyle = "#E7C77E";
    ctx.fillRect(0,H*0.32,W,H*0.44);
    ctx.fillStyle = "#D9A94F";
    ctx.fillRect(0,H*0.72,W,H*0.28);

    // soleil
    ctx.fillStyle = "#F7D77A";
    ctx.beginPath(); ctx.arc(W*0.82, H*0.12, 26, 0, Math.PI*2); ctx.fill();

    // silhouettes d'arbustes défilantes
    ctx.fillStyle = "rgba(90,60,20,.35)";
    const spacing = 130;
    const offset = (bgScroll*0.5) % spacing;
    for(let x = -offset; x < W+spacing; x += spacing){
      ctx.beginPath();
      ctx.ellipse(x, H*0.30, 22, 10, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // délimitation des 5 couloirs (RACER_COUNT) : mêmes pointillés défilants que la piste
    ctx.strokeStyle = "rgba(150,105,45,.35)";
    ctx.lineWidth = 3; ctx.lineCap = "round";
    const spacingTrack = 58, offsetTrack = (bgScroll*0.9) % spacingTrack;
    const laneRect = trackRectPx();
    for(let i=1;i<RACER_COUNT;i++){
      const laneY = laneRect.top + (i/RACER_COUNT)*laneRect.height;
      for(let x = -offsetTrack; x < W+spacingTrack; x += spacingTrack){
        ctx.beginPath(); ctx.moveTo(x, laneY); ctx.lineTo(x+16, laneY); ctx.stroke();
      }
    }

    ctx.strokeStyle = "rgba(120,80,30,.4)";
    ctx.lineWidth = 5;
    const spacingFront = 90, offsetFront = (bgScroll*1.6) % spacingFront;
    for(let x = -offsetFront; x < W+spacingFront; x += spacingFront){
      ctx.beginPath(); ctx.moveTo(x, H*0.85); ctx.lineTo(x+26, H*0.85); ctx.stroke();
    }

    // ligne d'arrivée (damier) si proche
    const player = racers[0];
    const remaining = TRACK_LENGTH - player.progress;
    if(remaining < 900){
      const fx = W*0.28 + remaining*SCALE;
      drawChecker(fx);
    }
  }
  function drawHawkShadow(){
    if(hawkT <= 0) return;
    const t = 1 - hawkT/HAWK_SWEEP_DUR; // 0..1, progression du survol
    const x = -60 + t*(W+120);
    const skyY = H*0.08;
    // trajectoire en V : fond vers le couloir menacé au milieu du survol, puis remonte
    const diveFactor = 1 - Math.abs(t-0.5)*2; // 0 aux extrémités (haut du ciel), 1 au point bas
    const rect = trackRectPx();
    const diveY = activeDangerLane != null ? rect.top + activeDangerLane*rect.height : skyY;
    const hawkY = skyY + (diveY - skyY) * diveFactor;

    ctx.strokeStyle = "rgba(20,15,10,.7)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x-18,hawkY-6); ctx.lineTo(x,hawkY); ctx.lineTo(x+18,hawkY-6); ctx.stroke(); // silhouette ailes

    if(activeDangerLane != null){
      // ombre projetée au sol, plus nette au plus fort du piqué
      const shadowAlpha = 0.14 + diveFactor*0.26;
      ctx.fillStyle = "rgba(20,15,10,"+shadowAlpha+")";
      ctx.beginPath(); ctx.ellipse(x, diveY, 26, 9, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawDangerZone(){
    if(dangerWarnT <= 0 || activeDangerLane == null) return;
    const rect = trackRectPx();
    const y = rect.top + activeDangerLane*rect.height;
    const pulse = 0.32 + Math.sin(performance.now()/70)*0.14;
    ctx.fillStyle = "rgba(200,60,40,"+pulse+")";
    ctx.fillRect(0, y-17, W, 34);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "bold 14px Fredoka, sans-serif";
    ctx.textAlign = "left";  ctx.fillText("⚠", 8, y+5);
    ctx.textAlign = "right"; ctx.fillText("⚠", W-8, y+5);
  }

  function drawSprintFlash(){
    if(sprintFlashT <= 0) return;
    const a = sprintFlashT / 0.3;
    const cx = W*0.5, cy = H*0.5;
    ctx.strokeStyle = "rgba(255,255,255,"+(a*0.55)+")";
    ctx.lineWidth = 3; ctx.lineCap = "round";
    const n = 10;
    for(let i=0;i<n;i++){
      const ang = (i/n)*Math.PI*2;
      const rInner = 36 + (1-a)*70;
      const rOuter = rInner + 26 + a*36;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ang)*rInner, cy+Math.sin(ang)*rInner*0.7);
      ctx.lineTo(cx+Math.cos(ang)*rOuter, cy+Math.sin(ang)*rOuter*0.7);
      ctx.stroke();
    }
  }

  function drawChecker(x){
    const size = 14;
    for(let row=0; row<H*0.4/size; row++){
      for(let col=0; col<2; col++){
        ctx.fillStyle = (row+col)%2===0 ? "#221F2C" : "#FFFBF3";
        ctx.fillRect(x+col*size, H*0.32+row*size, size, size);
      }
    }
  }

  function drawDust(x,y,intensity){
    for(let i=0;i<intensity;i++){
      ctx.fillStyle = "rgba(217,169,79,"+(0.18+Math.random()*0.15)+")";
      ctx.beginPath();
      ctx.arc(x - 14 - Math.random()*22, y + (Math.random()*10-5), 5+Math.random()*5, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawObstacle(o, screenX){
    const rect = trackRectPx();
    const y = rect.top + o.lane*rect.height;
    if(o.type === "trou"){
      ctx.fillStyle = "rgba(60,38,16,.55)";
      ctx.beginPath(); ctx.ellipse(screenX, y+9, 17, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(30,18,8,.75)";
      ctx.beginPath(); ctx.ellipse(screenX, y+9, 11, 5, 0, 0, Math.PI*2); ctx.fill();
    } else if(o.type === "caillou"){
      ctx.fillStyle = "#8B8378";
      ctx.beginPath();
      ctx.moveTo(screenX-9,y+7); ctx.lineTo(screenX-3,y-6); ctx.lineTo(screenX+7,y-8);
      ctx.lineTo(screenX+11,y+2); ctx.lineTo(screenX+2,y+9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#B5AA98";
      ctx.beginPath(); ctx.ellipse(screenX-1,y-3,3.5,2.5,0.4,0,Math.PI*2); ctx.fill();
    } else { // broussaille
      ctx.fillStyle = "#5B7247";
      for(let i=0;i<5;i++){
        const ang = (i/5)*Math.PI*2;
        ctx.beginPath();
        ctx.ellipse(screenX+Math.cos(ang)*7, y+Math.sin(ang)*4, 6, 4, ang, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.fillStyle = "#3E5230";
      ctx.beginPath(); ctx.ellipse(screenX, y+1, 5, 3.5, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawOstrich(r, screenX, isPlayer){
    const rect = trackRectPx();
    const y = rect.top + r.lane*rect.height;
    const c = r.colors;
    // choc avec un obstacle au sol : seules les pattes trébuchent (mouvement court et rapide) —
    // le reste du corps et la tête gardent leur foulée normale. Une bousculade (Ambitieuse,
    // voir bumpFlashT plus bas) ne touche jamais les pattes : c'est le corps qui l'encaisse.
    const legSwing = r.hitFlashT > 0 ? Math.sin(elapsedTime*46 + r.legPhase)*4 : Math.sin(r.legPhase)*10;
    const bob = Math.abs(Math.sin(r.legPhase))*4;

    // poussière : intensité liée à la vitesse réelle, pas juste au sprint
    const speedT = Math.max(0, Math.min(1, (r.speed - REST_SPEED) / (MAX_SPEED - REST_SPEED)));
    drawDust(screenX, y+18, Math.round(1 + speedT*5) + (isPlayer && r.sprintT>0 ? 3 : 0));

    // lignes de vitesse : se voient dès qu'on va vite, pas seulement en sprint
    if(speedT > 0.15){
      ctx.strokeStyle = "rgba(255,255,255,"+(0.15+speedT*0.3)+")";
      ctx.lineWidth = 2; ctx.lineCap = "round";
      for(let i=0;i<3;i++){
        const ly = y - bob - 6 + i*8;
        const len = 8 + speedT*24;
        ctx.beginPath(); ctx.moveTo(screenX-22, ly); ctx.lineTo(screenX-22-len, ly); ctx.stroke();
      }
    }

    // traînée de sprint : double couche pour un effet "comète" plus marqué
    if(isPlayer && r.sprintT>0){
      ctx.fillStyle = "rgba(230,140,130,.45)";
      ctx.beginPath(); ctx.ellipse(screenX-30, y-4-bob, 26, 9, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(230,140,130,.25)";
      ctx.beginPath(); ctx.ellipse(screenX-50, y-4-bob, 20, 7, 0, 0, Math.PI*2); ctx.fill();
    }

    // flash d'impact centré sur les pattes : seule partie réellement touchée par le choc
    if(r.hitFlashT > 0){
      const a = r.hitFlashT / 0.35;
      const legY = y + 17;
      ctx.strokeStyle = "rgba(255,255,255,"+(0.4+a*0.5)+")";
      ctx.lineWidth = 2;
      for(let i=0;i<5;i++){
        const ang = (i/5)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(screenX+Math.cos(ang)*9, legY+Math.sin(ang)*7);
        ctx.lineTo(screenX+Math.cos(ang)*(9+7*a), legY+Math.sin(ang)*(7+7*a));
        ctx.stroke();
      }
      if(isPlayer){
        ctx.fillStyle = "rgba(184,90,80,"+(0.55+a*0.45)+")";
        ctx.font = "bold 12px Fredoka, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Aïe !", screenX, legY+22);
      }
    }

    // flash de bousculade (Ambitieuse) : centré sur le corps, jamais les pattes ni la tête.
    // Visible pour tous les coureurs (pas seulement le joueur) pour que la mécanique se remarque.
    if(r.bumpFlashT > 0){
      const a = r.bumpFlashT / 0.6;
      const bodyY = y - bob + 4;
      ctx.strokeStyle = "rgba(255,255,255,"+(0.4+a*0.5)+")";
      ctx.lineWidth = 2;
      for(let i=0;i<5;i++){
        const ang = (i/5)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(screenX-2+Math.cos(ang)*13, bodyY+Math.sin(ang)*10);
        ctx.lineTo(screenX-2+Math.cos(ang)*(13+7*a), bodyY+Math.sin(ang)*(10+7*a));
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(184,90,80,"+(0.55+a*0.45)+")";
      ctx.font = "bold 12px Fredoka, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Boum !", screenX, bodyY-16);
    }

    ctx.save();
    ctx.translate(screenX, y - bob);
    if(isPlayer && r.sprintT > 0){
      ctx.scale(1.14, 0.92); // étirement "vitesse" pendant le sprint
    }

    // pattes
    ctx.strokeStyle = c.body; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-4,14); ctx.lineTo(-4+legSwing,26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,14); ctx.lineTo(4-legSwing,26); ctx.stroke();

    // corps
    ctx.fillStyle = c.dark;
    ctx.beginPath(); ctx.ellipse(-2,4,16,12,0,0,Math.PI*2); ctx.fill();
    // poitrail clair
    ctx.fillStyle = c.ruff;
    ctx.beginPath(); ctx.ellipse(6,8,8,9,0,0,Math.PI*2); ctx.fill();
    // cou
    ctx.strokeStyle = c.body; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(16,-20); ctx.stroke();
    // tête
    ctx.fillStyle = c.body;
    ctx.beginPath(); ctx.arc(18,-24,8,0,Math.PI*2); ctx.fill();
    // bec
    ctx.fillStyle = "#F0A93A";
    ctx.beginPath(); ctx.moveTo(24,-25); ctx.lineTo(34,-23); ctx.lineTo(24,-21); ctx.fill();
    // oeil
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(21,-26,2.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#221F2C";
    ctx.beginPath(); ctx.arc(21.8,-26,1.2,0,Math.PI*2); ctx.fill();

    ctx.restore();

    if(isPlayer){
      ctx.fillStyle = "#221F2C";
      ctx.font = "bold 10px Nunito, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("toi", screenX, y+38);
    }
  }

  function render(){
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); }

    drawBackground();
    drawHawkShadow();
    drawDangerZone();

    const player = racers[0];
    const playerScreenX = W*0.28;

    // trier par écran x pour un rendu correct (arrière -> avant), autruches + obstacles mélangés
    const drawList = racers.map((r,i)=>({
      kind:"racer", r, i, x: playerScreenX + (r.progress - player.progress) * SCALE
    })).concat(obstacles.map(o=>({
      kind:"obstacle", o, x: playerScreenX + (o.progress - player.progress) * SCALE
    }))).sort((a,b)=>a.x-b.x);

    drawList.forEach(d => {
      if(d.x < -40 || d.x > W+40) return; // hors écran
      if(d.kind === "racer") drawOstrich(d.r, d.x, d.i===0);
      else drawObstacle(d.o, d.x);
    });

    ctx.restore();
    drawSprintFlash();
  }

  /* ---------- Boucle principale ---------- */
  function loop(ts){
    if(!lastTs) lastTs = ts;
    const dt = Math.min(0.05, (ts-lastTs)/1000);
    lastTs = ts;
    if(raceRunning){
      update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  /* ---------- Résultats ---------- */
  function showResults(){
    raceRunning = false;
    document.getElementById("hud").classList.add("hidden");
    sprintBtn.classList.add("hidden");
    const ranked = [...racers].sort((a,b) => b.progress - a.progress);
    const list = document.getElementById("rankList");
    list.innerHTML = "";
    ranked.forEach((r, idx) => {
      const row = document.createElement("div");
      row.className = "rank-row" + (r.isPlayer ? " me" : "");
      row.innerHTML = `<span class="rank-pos">${idx+1}</span><span>${r.isPlayer ? "Toi ("+r.trait+")" : r.trait}</span><span class="rank-gain">+${PAYOUTS[idx]} 🪙</span>`;
      list.appendChild(row);
    });
    const playerRank = ranked.findIndex(r=>r.isPlayer)+1;
    document.getElementById("resultSubtitle").textContent =
      playerRank===1 ? "Tu remportes la course !" : `Tu termines ${playerRank}e sur 5`;
    document.getElementById("result").classList.remove("hidden");
  }

  /* ---------- Démarrage ---------- */
  document.getElementById("startBtn").onclick = () => {
    document.getElementById("start").classList.add("hidden");
    document.getElementById("hud").classList.remove("hidden");
    sprintBtn.classList.remove("hidden");
    resize();
    setupRace();
    raceRunning = true;
    lastTs = 0;
  };
  document.getElementById("replayBtn").onclick = () => {
    document.getElementById("result").classList.add("hidden");
    document.getElementById("start").classList.remove("hidden");
    renderTraitGrid();
    renderMatchBadge();
  };

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
